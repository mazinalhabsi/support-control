<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مكتبة الأدوات — Support Control</title>
  <meta name="description" content="مكتبة أدوات الأمن الهجومي: تعريف كل أداة، فئتها، ومجال استخدامها المصرّح به." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='18' font-size='18'>🛡️</text></svg>" />
</head>
<body dir="rtl" data-page="tools">
  <div id="nav"></div>

  <header class="section-sm" style="padding-top:56px;padding-bottom:20px">
    <div class="container">
      <span class="eyebrow">مكتبة الأدوات</span>
      <h1 style="font-size:clamp(2rem,4.5vw,3rem)">أدوات <span class="gradient-text">المحترفين</span></h1>
      <p class="lead" style="color:var(--text-soft);max-width:720px">تعرّف على الأدوات التي تعتمدها الفرق الأمنية حول العالم: ما هي، لماذا هي مهمّة، وكيف تُستخدم في اختبار مصرّح به.</p>
      <div class="callout callout-warn" style="margin-top:22px">
        <span id="warnIcon"></span>
        <div>كل هذه الأدوات مزدوجة الاستخدام. تعلّمها هنا موجّه للاختبار المصرّح به والدفاع فقط. استخدامها ضد أنظمة لا تملكها دون تفويض جريمة.</div>
      </div>
    </div>
  </header>

  <section class="section" style="padding-top:12px">
    <div class="container">
      <div class="filters" id="toolFilters"></div>
      <div class="grid grid-auto" id="toolGrid"></div>
    </div>
  </section>

  <div id="footer"></div>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("warnIcon").innerHTML = window.ICONS.alert;
    });
  </script>
</body>
</html>
