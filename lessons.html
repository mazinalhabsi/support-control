<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الدروس — Support Control</title>
  <meta name="description" content="مكتبة دروس الاختراق الأخلاقي: دروس مفصّلة مصنّفة حسب المستوى والمرحلة، مع فيديوهات ومحتوى مرجعي." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='18' font-size='18'>🛡️</text></svg>" />
</head>
<body dir="rtl" data-page="lessons">
  <div id="nav"></div>

  <header class="section-sm" style="padding-top:56px;padding-bottom:20px">
    <div class="container">
      <span class="eyebrow">مكتبة الدروس</span>
      <h1 style="font-size:clamp(2rem,4.5vw,3rem)">كل <span class="gradient-text">الدروس</span></h1>
      <p class="lead" style="color:var(--text-soft);max-width:680px">تصفّح الدروس حسب المستوى، أو ابحث عن موضوع محدّد. كل درس يتضمّن أهدافًا وفيديو ومحتوى مرجعيًا مفصّلًا.</p>
    </div>
  </header>

  <section class="section" style="padding-top:12px">
    <div class="container">
      <div class="filters" id="lessonFilters">
        <button class="chip active" data-level="all">الكل</button>
        <button class="chip" data-level="beginner">مبتدئ</button>
        <button class="chip" data-level="inter">متوسط</button>
        <button class="chip" data-level="advanced">متقدّم</button>
        <button class="chip" data-level="expert">خبير</button>
        <div class="search-box">
          <span id="searchIcon"></span>
          <input type="search" id="lessonSearch" placeholder="ابحث في الدروس…" aria-label="بحث" />
        </div>
      </div>
      <div class="grid grid-auto" id="lessonGrid"></div>
    </div>
  </section>

  <div id="footer"></div>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("searchIcon").innerHTML = window.ICONS.search;
    });
  </script>
</body>
</html>
