<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Support Control — أكاديمية الاختراق الأخلاقي</title>
<meta name="description" content="منصّة تعليمية متخصّصة في الاختراق الأخلاقي والأمن الهجومي، من الصفر إلى الاحتراف: دروس مفصّلة، أدوات، معامل، وتمارين عملية بإطار أخلاقي وقانوني. ملف واحد مستقل." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='18' font-size='18'>🛡️</text></svg>" />
<style>
/* =========================================================================
   Support Control — منصة تعليم الاختراق الأخلاقي
   Design System / Core Stylesheet
   ========================================================================= */

/* ----------------------------- Design Tokens --------------------------- */
:root {
  /* Base surfaces (deep, calm, "security console" feel) */
  --bg-0: #070a12;
  --bg-1: #0b0f1a;
  --bg-2: #111726;
  --surface: #141b2d;
  --surface-2: #1a2335;
  --surface-3: #212c42;
  --line: #243049;
  --line-soft: #1b2437;

  /* Text */
  --text: #e8eef7;
  --text-soft: #aab6cc;
  --text-mute: #70809b;
  --text-dim: #4a566e;

  /* Brand — cyber teal + electric indigo (professional, not neon-cheesy) */
  --brand: #37e0c4;
  --brand-strong: #16c8a8;
  --brand-dim: rgba(55, 224, 196, 0.12);
  --accent: #6c8cff;
  --accent-2: #a779ff;

  /* Semantic */
  --danger: #ff5d6c;
  --warn: #ffbf5d;
  --ok: #4ade80;
  --info: #5db8ff;

  /* Difficulty palette */
  --lvl-beginner: #4ade80;
  --lvl-inter: #ffbf5d;
  --lvl-advanced: #ff8a5d;
  --lvl-expert: #ff5d6c;

  /* Typography */
  --font-sans: "Tajawal", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", ui-monospace, monospace;

  /* Radii & shadows */
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 14px 40px rgba(0, 0, 0, 0.45);
  --shadow-glow: 0 0 0 1px rgba(55, 224, 196, 0.18), 0 18px 50px -12px rgba(55, 224, 196, 0.25);

  /* Layout */
  --max: 1200px;
  --nav-h: 72px;
}

/* ------------------------------- Reset --------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font-sans);
  background: var(--bg-0);
  color: var(--text);
  line-height: 1.7;
  font-size: 16px;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
body[dir="rtl"] { direction: rtl; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; }
/* Default inline-icon size so no bare <svg> ever expands to its intrinsic box.
   Component rules below (.card-icon svg, .btn svg, …) override this. */
svg { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.18em; }
ul { margin: 0; padding: 0; list-style: none; }
h1, h2, h3, h4 { line-height: 1.3; margin: 0 0 .5em; font-weight: 800; letter-spacing: -0.01em; }
p { margin: 0 0 1em; }

/* Ambient background: subtle grid + glow blobs */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size: 54px 54px;
  opacity: 0.35;
  -webkit-mask-image: radial-gradient(circle at 50% 0%, #000 0%, transparent 70%);
          mask-image: radial-gradient(circle at 50% 0%, #000 0%, transparent 70%);
  z-index: -2;
  pointer-events: none;
}
body::after {
  content: "";
  position: fixed;
  top: -200px; left: 50%;
  width: 900px; height: 700px;
  transform: translateX(-50%);
  background:
    radial-gradient(420px 320px at 30% 30%, rgba(55, 224, 196, 0.16), transparent 70%),
    radial-gradient(480px 360px at 75% 20%, rgba(108, 140, 255, 0.16), transparent 70%);
  filter: blur(30px);
  z-index: -1;
  pointer-events: none;
}

/* ------------------------------ Layout --------------------------------- */
.container { width: 100%; max-width: var(--max); margin-inline: auto; padding-inline: 22px; }
.section { padding: 84px 0; }
.section-sm { padding: 54px 0; }
.stack > * + * { margin-top: 18px; }

.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: .76rem; letter-spacing: .14em;
  text-transform: uppercase; color: var(--brand);
  padding: 6px 14px; border-radius: 100px;
  background: var(--brand-dim);
  border: 1px solid rgba(55, 224, 196, 0.28);
  margin-bottom: 18px;
}
.section-head { max-width: 720px; margin-bottom: 44px; }
.section-head h2 { font-size: clamp(1.7rem, 3.4vw, 2.5rem); }
.section-head p { color: var(--text-soft); font-size: 1.06rem; }
.text-center { text-align: center; }
.text-center .section-head { margin-inline: auto; }

.gradient-text {
  background: linear-gradient(110deg, var(--brand) 0%, var(--accent) 55%, var(--accent-2) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}

/* ------------------------------ Navbar --------------------------------- */
.nav {
  position: sticky; top: 0; z-index: 100;
  height: var(--nav-h);
  display: flex; align-items: center;
  background: rgba(8, 11, 18, 0.72);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border-bottom: 1px solid var(--line-soft);
}
.nav .container { display: flex; align-items: center; gap: 24px; }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.12rem; }
.brand .logo {
  width: 40px; height: 40px; border-radius: 11px; flex: none;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--brand), var(--accent));
  box-shadow: var(--shadow-glow);
  color: #06111b;
}
.brand .logo svg { width: 22px; height: 22px; }
.brand small { display: block; font-size: .64rem; color: var(--text-mute); font-weight: 600; letter-spacing: .12em; }
.nav-links { display: flex; align-items: center; gap: 4px; margin-inline-start: auto; }
.nav-links a {
  padding: 9px 15px; border-radius: 10px; color: var(--text-soft);
  font-weight: 600; font-size: .95rem; transition: .18s;
}
.nav-links a:hover { color: var(--text); background: var(--surface-2); }
.nav-links a.active { color: var(--brand); background: var(--brand-dim); }
.nav-cta { margin-inline-start: 8px; }
.nav-toggle { display: none; background: none; border: 0; color: var(--text); padding: 8px; }
.nav-toggle svg { width: 26px; height: 26px; }

/* ------------------------------ Buttons -------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  padding: 12px 22px; border-radius: 12px; font-weight: 700; font-size: .96rem;
  border: 1px solid transparent; transition: .2s; white-space: nowrap;
}
.btn svg { width: 18px; height: 18px; }
.btn-primary {
  background: linear-gradient(120deg, var(--brand), var(--brand-strong));
  color: #04131a; box-shadow: 0 10px 28px -8px rgba(55, 224, 196, 0.5);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 36px -8px rgba(55, 224, 196, 0.6); }
.btn-ghost { background: var(--surface-2); color: var(--text); border-color: var(--line); }
.btn-ghost:hover { background: var(--surface-3); border-color: var(--brand); }
.btn-outline { background: transparent; color: var(--brand); border-color: rgba(55, 224, 196, 0.4); }
.btn-outline:hover { background: var(--brand-dim); }
.btn-lg { padding: 15px 30px; font-size: 1.05rem; }
.btn-block { width: 100%; }

/* ------------------------------- Cards --------------------------------- */
.card {
  background: linear-gradient(180deg, var(--surface), var(--bg-1));
  border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 26px; transition: .22s; position: relative; overflow: hidden;
}
.card:hover { border-color: rgba(55, 224, 196, 0.4); transform: translateY(-4px); box-shadow: var(--shadow-md); }
.card-icon {
  width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center;
  background: var(--brand-dim); color: var(--brand); margin-bottom: 18px;
  border: 1px solid rgba(55, 224, 196, 0.25);
}
.card-icon svg { width: 26px; height: 26px; }
.card h3 { font-size: 1.18rem; }
.card p { color: var(--text-soft); font-size: .96rem; margin-bottom: 0; }

.grid { display: grid; gap: 22px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-auto { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

/* ------------------------------- Badges -------------------------------- */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .74rem; font-weight: 700; padding: 4px 11px; border-radius: 100px;
  font-family: var(--font-mono); letter-spacing: .02em;
}
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge-beginner { color: var(--lvl-beginner); background: rgba(74, 222, 128, 0.12); }
.badge-inter { color: var(--lvl-inter); background: rgba(255, 191, 93, 0.12); }
.badge-advanced { color: var(--lvl-advanced); background: rgba(255, 138, 93, 0.12); }
.badge-expert { color: var(--lvl-expert); background: rgba(255, 93, 108, 0.12); }
.badge-neutral { color: var(--text-soft); background: var(--surface-3); }
.badge-neutral::before { display: none; }

.tag {
  font-family: var(--font-mono); font-size: .76rem; color: var(--text-soft);
  background: var(--surface-2); border: 1px solid var(--line);
  padding: 4px 10px; border-radius: 7px;
}

/* ------------------------------- Hero ---------------------------------- */
.hero { position: relative; padding: 72px 0 60px; }
.hero-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 50px; align-items: center; }
.hero h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.12; margin-bottom: 22px; }
.hero .lead { font-size: 1.16rem; color: var(--text-soft); margin-bottom: 30px; max-width: 560px; }
.hero-actions { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 34px; }
.hero-stats { display: flex; gap: 34px; flex-wrap: wrap; }
.hero-stats .stat strong { display: block; font-size: 1.7rem; font-weight: 800; color: var(--text); font-family: var(--font-mono); }
.hero-stats .stat span { font-size: .86rem; color: var(--text-mute); }

/* Terminal mock */
.terminal {
  background: #060a12; border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-md); overflow: hidden; font-family: var(--font-mono);
  direction: ltr; text-align: left;
}
.terminal-bar {
  display: flex; align-items: center; gap: 8px; padding: 12px 16px;
  background: var(--surface-2); border-bottom: 1px solid var(--line);
}
.terminal-bar .dot { width: 12px; height: 12px; border-radius: 50%; }
.terminal-bar .dot.r { background: #ff5f57; }
.terminal-bar .dot.y { background: #febc2e; }
.terminal-bar .dot.g { background: #28c840; }
.terminal-bar .ttl { margin-inline-start: auto; font-size: .76rem; color: var(--text-mute); }
.terminal-body { padding: 20px; font-size: .86rem; line-height: 1.9; min-height: 290px; }
.terminal-body .ln { white-space: pre-wrap; }
.terminal-body .pr { color: var(--brand); }
.terminal-body .cm { color: var(--text); }
.terminal-body .ok { color: var(--ok); }
.terminal-body .mu { color: var(--text-mute); }
.terminal-body .hl { color: var(--accent); }
.cursor { display: inline-block; width: 9px; height: 1.05em; background: var(--brand); vertical-align: text-bottom; animation: blink 1.1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ------------------------------ Roadmap -------------------------------- */
.roadmap { position: relative; }
.phase {
  display: grid; grid-template-columns: 76px 1fr; gap: 20px;
  position: relative; padding-bottom: 14px;
}
.phase-rail { display: flex; flex-direction: column; align-items: center; }
.phase-num {
  width: 56px; height: 56px; border-radius: 16px; flex: none;
  display: grid; place-items: center; font-family: var(--font-mono); font-weight: 800;
  font-size: 1.1rem; background: var(--surface-2); border: 1px solid var(--line); color: var(--brand);
  z-index: 2;
}
.phase-line { width: 2px; flex: 1; background: linear-gradient(var(--brand), transparent); margin-top: 6px; min-height: 30px; }
.phase:last-child .phase-line { display: none; }
.phase-body { padding-bottom: 28px; }

/* --------------------------- Lessons / Tools --------------------------- */
.filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; align-items: center; }
.filters .chip {
  padding: 8px 16px; border-radius: 100px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text-soft); font-weight: 600; font-size: .9rem; transition: .18s;
}
.filters .chip:hover { color: var(--text); border-color: var(--brand); }
.filters .chip.active { background: var(--brand-dim); color: var(--brand); border-color: rgba(55, 224, 196, 0.4); }
.search-box {
  display: flex; align-items: center; gap: 10px; margin-inline-start: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 100px; padding: 8px 16px;
}
.search-box svg { width: 18px; height: 18px; color: var(--text-mute); }
.search-box input { background: none; border: 0; color: var(--text); outline: none; font-family: inherit; font-size: .92rem; width: 180px; }

.lesson-card { display: flex; flex-direction: column; cursor: pointer; }
.lesson-card .meta-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.lesson-card .num { font-family: var(--font-mono); color: var(--text-dim); font-size: .82rem; }
.lesson-card h3 { font-size: 1.1rem; margin-bottom: 8px; }
.lesson-card p { font-size: .92rem; color: var(--text-soft); flex: 1; }
.lesson-card .foot { display: flex; align-items: center; gap: 14px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line-soft); font-size: .82rem; color: var(--text-mute); }
.lesson-card .foot span { display: inline-flex; align-items: center; gap: 6px; }
.lesson-card .foot svg { width: 15px; height: 15px; }

.tool-card .tool-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.tool-logo {
  width: 46px; height: 46px; border-radius: 12px; flex: none; display: grid; place-items: center;
  font-family: var(--font-mono); font-weight: 800; font-size: 1.1rem; color: #06111b;
}
.tool-card h3 { margin: 0; font-size: 1.08rem; }
.tool-card .cat { font-size: .78rem; color: var(--text-mute); font-family: var(--font-mono); }

/* ------------------------------- Prose --------------------------------- */
.prose { max-width: 820px; }
.prose h2 { font-size: 1.6rem; margin-top: 2em; padding-top: .4em; }
.prose h3 { font-size: 1.22rem; margin-top: 1.6em; color: var(--brand); }
.prose p, .prose li { color: var(--text-soft); }
.prose ul, .prose ol { padding-inline-start: 1.4em; margin: 0 0 1.2em; }
.prose ul li { list-style: none; position: relative; padding-inline-start: 22px; margin-bottom: .5em; }
.prose ul li::before { content: "▹"; position: absolute; inset-inline-start: 0; color: var(--brand); }
.prose ol { counter-reset: step; }
.prose ol li { margin-bottom: .6em; }
.prose strong { color: var(--text); }
.prose a { color: var(--brand); border-bottom: 1px dashed rgba(55,224,196,.4); }
.prose code {
  font-family: var(--font-mono); font-size: .88em; background: var(--surface-2);
  padding: 2px 7px; border-radius: 6px; color: var(--brand); border: 1px solid var(--line-soft);
}
.prose pre {
  background: #060a12; border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 18px 20px; overflow-x: auto; direction: ltr; text-align: left; margin: 0 0 1.4em;
}
.prose pre code { background: none; border: 0; padding: 0; color: var(--text); font-size: .86rem; line-height: 1.8; }

.callout {
  border-radius: var(--r-md); padding: 18px 20px; margin: 0 0 1.4em;
  border: 1px solid var(--line); background: var(--surface); display: flex; gap: 14px;
}
.callout svg { width: 22px; height: 22px; flex: none; margin-top: 2px; }
.callout p:last-child { margin-bottom: 0; }
.callout-info { border-inline-start: 3px solid var(--info); } .callout-info svg { color: var(--info); }
.callout-warn { border-inline-start: 3px solid var(--warn); } .callout-warn svg { color: var(--warn); }
.callout-danger { border-inline-start: 3px solid var(--danger); } .callout-danger svg { color: var(--danger); }
.callout-ok { border-inline-start: 3px solid var(--ok); } .callout-ok svg { color: var(--ok); }
.callout strong { color: var(--text); }

/* Video frame */
.video-frame {
  position: relative; aspect-ratio: 16/9; border-radius: var(--r-md); overflow: hidden;
  background: linear-gradient(135deg, var(--surface-2), var(--bg-1));
  border: 1px solid var(--line); display: grid; place-items: center; margin-bottom: 1.4em;
}
.video-frame .play {
  width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--brand), var(--accent)); color: #04131a;
  box-shadow: var(--shadow-glow); transition: .2s;
}
.video-frame:hover .play { transform: scale(1.08); }
.video-frame .play svg { width: 30px; height: 30px; margin-inline-start: 3px; }
.video-frame .vlabel { position: absolute; bottom: 14px; inset-inline-start: 16px; font-size: .82rem; color: var(--text-mute); font-family: var(--font-mono); }

/* --------------------------- Lesson detail ----------------------------- */
.lesson-layout { display: grid; grid-template-columns: 1fr 280px; gap: 46px; align-items: start; }
.lesson-aside { position: sticky; top: calc(var(--nav-h) + 24px); }
.toc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 20px; }
.toc h4 { font-size: .82rem; text-transform: uppercase; letter-spacing: .1em; color: var(--text-mute); margin-bottom: 14px; }
.toc a { display: block; padding: 7px 0; color: var(--text-soft); font-size: .9rem; border-inline-start: 2px solid transparent; padding-inline-start: 12px; transition: .15s; }
.toc a:hover, .toc a.active { color: var(--brand); border-color: var(--brand); }
.lesson-hero-meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }

.objectives { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 22px 26px; margin-bottom: 2em; }
.objectives h4 { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
.objectives h4 svg { width: 20px; height: 20px; color: var(--brand); }

/* --------------------------------- CTA --------------------------------- */
.cta-band {
  background:
    radial-gradient(500px 300px at 20% 0%, rgba(55,224,196,.14), transparent 70%),
    radial-gradient(500px 300px at 80% 100%, rgba(108,140,255,.14), transparent 70%),
    var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-xl); padding: 54px; text-align: center;
}
.cta-band h2 { font-size: clamp(1.6rem, 3.4vw, 2.3rem); }
.cta-band p { color: var(--text-soft); max-width: 560px; margin-inline: auto 0; margin-inline: auto; margin-bottom: 26px; }

/* ------------------------------- Footer -------------------------------- */
.footer { border-top: 1px solid var(--line-soft); background: var(--bg-1); padding: 56px 0 30px; margin-top: 60px; }
.footer-grid { display: grid; grid-template-columns: 1.6fr repeat(3, 1fr); gap: 34px; margin-bottom: 40px; }
.footer-col h5 { font-size: .82rem; text-transform: uppercase; letter-spacing: .12em; color: var(--text-mute); margin-bottom: 16px; }
.footer-col a { display: block; color: var(--text-soft); padding: 5px 0; font-size: .92rem; transition: .15s; }
.footer-col a:hover { color: var(--brand); }
.footer-brand p { color: var(--text-mute); font-size: .92rem; max-width: 320px; margin-top: 14px; }
.footer-bottom { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-top: 24px; border-top: 1px solid var(--line-soft); color: var(--text-mute); font-size: .86rem; flex-wrap: wrap; }
.ethics-note { display: flex; align-items: center; gap: 8px; color: var(--warn); font-size: .84rem; }
.ethics-note svg { width: 16px; height: 16px; }

/* ------------------------------ Progress ------------------------------- */
.progress-ring { --p: 0; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--brand) calc(var(--p) * 1%), var(--surface-3) 0); position: relative; }
.progress-ring::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--bg-1); }
.progress-ring span { position: relative; font-family: var(--font-mono); font-size: .78rem; font-weight: 700; }

/* ------------------------------ Utilities ------------------------------ */
.reveal { opacity: 0; transform: translateY(24px); transition: opacity .6s ease, transform .6s ease; }
.reveal.in { opacity: 1; transform: none; }
.mt-0 { margin-top: 0; } .mb-0 { margin-bottom: 0; }
.divider { height: 1px; background: var(--line-soft); border: 0; margin: 48px 0; }
.muted { color: var(--text-mute); }

      { t: "mu", txt: "[02] الاستطلاع  ·  [03] الفحص والتعداد" },
      { t: "mu", txt: "[04] الثغرات  ·  [05] الاستغلال (معمل)" },
      { t: "hl", txt: "[06→10] ما بعد الاستغلال · الويب · اللاسلكي …" },
      { t: "pr", txt: "└─$ ", cmd: "start --now", cursor: true },
    ];
    var i = 0; box.innerHTML = "";
    (function add() {
      if (i >= lines.length) return;
      var l = lines[i++], div = document.createElement("div");
      div.className = "ln";
      var html = '<span class="' + l.t + '">' + l.txt + '</span>';
      if (l.cmd) html += '<span class="cm">' + l.cmd + '</span>';
      if (l.cursor) html += '<span class="cursor"></span>';
      div.innerHTML = html; box.appendChild(div);
      setTimeout(add, l.cmd ? 520 : 300);
    })();
  }
  function initReveal() {
    var els = $$(".reveal");
    if (!("IntersectionObserver" in window) || !els.length) { els.forEach(function (e) { e.classList.add("in"); }); return; }
    var io = new IntersectionObserver(function (ents) {
      ents.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
    }, { threshold: 0.12 });
    els.forEach(function (e) { io.observe(e); });
  }
  function initScrollSpy() {
    var links = $$("#lessonToc a[href^='#']"); if (!links.length) return;
    var secs = $$("#lessonContent section");
    var spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (e.isIntersecting) links.forEach(function (a) { a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id); });
      });
    }, { rootMargin: "-20% 0px -70% 0px" });
    secs.forEach(function (s) { spy.observe(s); });
    // منع قفز الـ hash الداخلي للأقسام من كسر التوجيه
    links.forEach(function (a) {
      a.addEventListener("click", function (ev) {
        ev.preventDefault();
        var el = document.getElementById(a.getAttribute("href").slice(1));
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
  }
  function wireLessons() {
    drawLessons();
    $$("#lessonFilters .chip").forEach(function (c) {
      c.addEventListener("click", function () {
        $$("#lessonFilters .chip").forEach(function (x) { x.classList.remove("active"); });
        c.classList.add("active");
        drawLessons(c.dataset.level, ($("#lessonSearch") || {}).value || "");
      });
    });
    var s = $("#lessonSearch");
    if (s) s.addEventListener("input", function () {
      var active = ($("#lessonFilters .chip.active") || {}).dataset;
      drawLessons(active ? active.level : "all", s.value);
    });
  }
  function wireTools() {
    drawTools();
    $$("#toolFilters .chip").forEach(function (c) {
      c.addEventListener("click", function () {
        $$("#toolFilters .chip").forEach(function (x) { x.classList.remove("active"); });
        c.classList.add("active"); drawTools(c.dataset.cat);
      });
    });
  }

  /* ----------------------------- Router -------------------------------- */
  function setActiveNav(route) {
    $$("#navLinks a").forEach(function (a) { a.classList.remove("active"); });
    var map = { home: "#/", curriculum: "#/curriculum", lessons: "#/lessons", lesson: "#/lessons", tools: "#/tools", labs: "#/labs", certs: "#/certs" };
    var href = map[route];
    if (href) { var el = $('#navLinks a[href="' + href + '"]'); if (el) el.classList.add("active"); }
  }
  function render() {
    var r = parseHash();
    var view = $("#view");
    document.title = "Support Control — أكاديمية الاختراق الأخلاقي";
    var html = V[r.route] ? (r.route === "lesson" ? V.lesson(r.id) : V[r.route]()) : V.home();
    view.innerHTML = html;
    // close mobile menu
    var nl = $("#navLinks"); if (nl) nl.classList.remove("open");
    var tg = $("#navToggle"); if (tg) tg.innerHTML = I.menu;
    setActiveNav(r.route);
    window.scrollTo(0, 0);
    // per-view wiring
    if (r.route === "home") initTerminal();
    if (r.route === "lessons") wireLessons();
    if (r.route === "tools") wireTools();
    if (r.route === "lesson") initScrollSpy();
    initReveal();
  }

  function boot() {
    document.getElementById("nav").outerHTML = navHTML("home");
    document.getElementById("footer").outerHTML = footHTML();
    var tg = $("#navToggle");
    if (tg) tg.addEventListener("click", function () {
      var lk = $("#navLinks"); lk.classList.toggle("open");
      tg.innerHTML = lk.classList.contains("open") ? I.x : I.menu;
    });
    window.addEventListener("hashchange", render);
    render();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
</body>
</html>
